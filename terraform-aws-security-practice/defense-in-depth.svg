<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="900" height="480" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">Defense in Depth — Applied to This Repo's EC2 + IAM Role + S3 Exercise</text>

  <!-- Attacker -->
  <circle cx="80" cy="240" r="40" fill="#3b0d0d" stroke="#ff4d4d" stroke-width="2"/>
  <text x="80" y="235" text-anchor="middle" fill="#ffb3b3" font-size="24">🕵</text>
  <text x="80" y="300" text-anchor="middle" fill="#ff8080" font-size="13">Attacker</text>

  <!-- Arrow 1 -->
  <line x1="125" y1="240" x2="185" y2="240" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 1: Network -->
  <rect x="190" y="190" width="150" height="100" rx="8" fill="#1a2540" stroke="#5b8def" stroke-width="2"/>
  <text x="265" y="215" text-anchor="middle" fill="#9db8f2" font-size="12" font-weight="bold">LAYER 1 — Network</text>
  <text x="265" y="240" text-anchor="middle" fill="#e6edf3" font-size="11">Security Group</text>
  <text x="265" y="257" text-anchor="middle" fill="#e6edf3" font-size="11">Port 22, single IP only</text>
  <text x="265" y="274" text-anchor="middle" fill="#7ee787" font-size="10">✓ tested: blocked from other IPs</text>

  <!-- Arrow 2 -->
  <line x1="345" y1="240" x2="405" y2="240" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 2: Auth -->
  <rect x="410" y="190" width="150" height="100" rx="8" fill="#1a2540" stroke="#5b8def" stroke-width="2"/>
  <text x="485" y="215" text-anchor="middle" fill="#9db8f2" font-size="12" font-weight="bold">LAYER 2 — Auth</text>
  <text x="485" y="240" text-anchor="middle" fill="#e6edf3" font-size="11">SSH Key Pair</text>
  <text x="485" y="257" text-anchor="middle" fill="#e6edf3" font-size="11">Private key never</text>
  <text x="485" y="272" text-anchor="middle" fill="#e6edf3" font-size="11">leaves local machine</text>

  <!-- Arrow 3 -->
  <line x1="565" y1="240" x2="625" y2="240" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 3: Identity -->
  <rect x="630" y="190" width="150" height="100" rx="8" fill="#3d2b1a" stroke="#e0a458" stroke-width="2"/>
  <text x="705" y="215" text-anchor="middle" fill="#f0c284" font-size="12" font-weight="bold">LAYER 3 — Identity</text>
  <text x="705" y="240" text-anchor="middle" fill="#e6edf3" font-size="11">IAM Role, temp creds</text>
  <text x="705" y="257" text-anchor="middle" fill="#e6edf3" font-size="11">Read-only (S3)</text>
  <text x="705" y="274" text-anchor="middle" fill="#7ee787" font-size="10">✓ tested: PutObject = Denied</text>

  <!-- Arrow down to layer 4 -->
  <line x1="705" y1="290" x2="705" y2="345" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Layer 4: Data -->
  <rect x="480" y="350" width="300" height="100" rx="8" fill="#2b1a3d" stroke="#a458e0" stroke-width="2"/>
  <text x="630" y="375" text-anchor="middle" fill="#d3a4f0" font-size="12" font-weight="bold">LAYER 4 — Data at Rest (S3)</text>
  <text x="630" y="398" text-anchor="middle" fill="#e6edf3" font-size="11">Public access blocked · AES256 encryption · Versioning enabled</text>
  <text x="630" y="420" text-anchor="middle" fill="#7ee787" font-size="10">✓ verified via AWS CLI (get-public-access-block, get-bucket-encryption, get-bucket-versioning)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/>
    </marker>
  </defs>
</svg>
